<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mentors Marine Provisions - Redirecting...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Encodes path and query parameters into hash route for HashRouter
      (function () {
        var location = window.location;
        var path = location.pathname;
        var search = location.search || '';
        var hash = location.hash || '';

        // If path has repository segments or subpaths, preserve root
        // Example: /mentors-marine/get-a-quote -> /mentors-marine/#/get-a-quote
        var segments = path.split('/').filter(Boolean);
        if (segments.length > 0) {
          var firstSegment = segments[0];
          // Check if hosted on custom domain or repo path
          // If repo path like /repo-name/
          var isGitHubSubpath = location.hostname.endsWith('github.io');
          if (isGitHubSubpath) {
            var remaining = segments.slice(1).join('/');
            var target = '/' + firstSegment + '/#' + (remaining ? '/' + remaining : '') + (search ? '?' + search.slice(1) : '') + (hash ? hash : '');
            location.replace(target);
            return;
          }
        }
        // Root domain fallback
        location.replace('/#' + path + search + hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=./" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #07172C;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .card {
        padding: 2rem;
        background: #0B2545;
        border-radius: 1rem;
        border: 1px solid #13315C;
        max-width: 400px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #EE964B;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1.5rem auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #EE964B;
        text-decoration: underline;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h3 style="margin-top:0; font-size:1.125rem;">Mentors Marine Provisions</h3>
      <p style="color:#94A3B8; font-size:0.875rem; margin-bottom:1.5rem;">Redirecting to Suez 24/7 Dispatch Desk...</p>
      <a href="./">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
