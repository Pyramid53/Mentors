<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Premium Navy Gradient matching navbar badge -->
    <linearGradient id="brandNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102C4E" />
      <stop offset="100%" stop-color="#07172C" />
    </linearGradient>
    
    <!-- Golden Maritime Accent Gradient matching brand amber text -->
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Golden Border Glow -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Base Emblem Container -->
  <rect width="64" height="64" rx="16" fill="url(#brandNavy)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" />

  <!-- Mentors Marine Anchor Logo (Identical to Navbar Brand Mark) -->
  <g transform="translate(10.4, 10.4) scale(1.8)" stroke="url(#brandGold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="5" r="3" />
    <line x1="12" y1="22" x2="12" y2="8" />
    <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
  </g>
</svg>
